[project]
name = "kev"
version = "0.1.0"
description = "A small System One decision model for X-ray baggage screening, built from scratch to learn how it works"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless>=5.0.0.93",
    "pillow",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "torch",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
